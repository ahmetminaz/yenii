<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Dünyadan Bişeyler</title>
<style>
@font-face{font-family:Anton;src:url(fonts/anton.ttf)}
@font-face{font-family:Oswald;src:url(fonts/oswald.ttf);font-weight:200 700}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#222}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;background:#000;font-family:Oswald,sans-serif;margin:0 auto 20px}
.art{position:absolute;left:0;top:0;width:1080px;height:1000px}
.band{position:absolute;left:0;right:0;bottom:0;height:420px;background:linear-gradient(#000 0,#000 100%);padding:34px 60px 0;text-align:center;color:#fff}
.fade{position:absolute;left:0;right:0;top:880px;height:140px;background:linear-gradient(transparent,#000)}
h2{font-family:Anton;font-weight:400;font-size:96px;line-height:1.02;letter-spacing:1px;text-transform:uppercase}
p{font-size:40px;line-height:1.28;margin-top:18px;font-weight:400}
b{color:#f7c52b;font-weight:500}
.y{color:#f7c52b}
.num{position:absolute;left:44px;top:44px;font-family:Anton;font-size:44px;color:#fff;background:rgba(0,0,0,.55);border:2px solid #f7c52b;border-radius:50px;padding:6px 26px;letter-spacing:2px}
.brand{position:absolute;right:44px;top:50px;display:flex;align-items:center;gap:12px;font-family:Anton;font-size:30px;letter-spacing:2px;color:#fff;text-shadow:0 2px 8px #000}
.brand img{width:62px;height:62px;border-radius:50%}
.big{font-family:Anton;text-transform:uppercase;text-align:center}
</style></head><body>
<div id="root"></div>
<script>
const STARS=(n,seed,h=1000)=>{let s=seed,r=()=>(s=(s*16807)%2147483647)/2147483647,o='';for(let i=0;i<n;i++)o+=`<circle cx="${r()*1080}" cy="${r()*h}" r="${r()*2.2+.4}" fill="#fff" opacity="${r()*.8+.2}"/>`;return o};

const glow=(id,c)=>`<radialGradient id="${id}"><stop offset="0" stop-color="${c}" stop-opacity=".9"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>`;

<path d="M0 640 L200 380 L360 560 L560 280 L780 600 L940 420 L1080 560 V1000 H0Z" fill="#dfe8f5"/><path d="M0 760 Q300 680 540 740 T1080 720 V1000 H0Z" fill="#c4d2e6"/>
<g fill="#0a1220"><path d="M60 800 L100 650 L140 800Z"/><path d="M150 830 L200 640 L250 830Z"/><path d="M860 820 L910 650 L960 820Z"/><path d="M960 800 L1010 620 L1060 800Z"/></g>
<g transform="translate(540 700)"><path d="M-170 130 L0 -120 L170 130Z" fill="#e8872b"/><path d="M-170 130 L0 -120 L170 130Z" fill="url(#r)"/><path d="M-30 130 L0 20 L40 130Z" fill="#7a3a10"/><path d="M-55 40 L80 90" stroke="#0a1220" stroke-width="6"/></g>
<ellipse cx="540" cy="840" rx="320" ry="28" fill="#fff" opacity=".18"/>`),
ame:SVG(grad('g','#f28c4a','#2b1b4d')+glow('r','#ffd9a0'),`<rect width="1080" height="1000" fill="url(#g)"/><circle cx="540" cy="580" r="220" fill="url(#r)"/><circle cx="540" cy="580" r="120" fill="#ffe3b0"/>
<path d="M0 640 H1080 V1000 H0Z" fill="#241438"/><g stroke="#ffd9a0" stroke-width="5" opacity=".5"><path d="M380 650 H700"/><path d="M420 690 H660"/><path d="M450 730 H630"/></g>
<g transform="translate(250 280) rotate(-8)" fill="#120a1f"><path d="M0 40 H260 L300 60 L260 80 H0Z"/><path d="M90 40 L160 -20 H180 L140 40Z"/><path d="M90 80 L160 130 H180 L140 80Z"/><path d="M0 40 L-10 0 H10 L40 40Z"/></g>
<text x="760" y="480" font-family="Anton" font-size="240" fill="#ffd9a0" opacity=".85">?</text>`),
roa:SVG(grad('g','#101c14','#050a07')+glow('r','#e8ffd0'),`<rect width="1080" height="1000" fill="url(#g)"/><circle cx="800" cy="180" r="180" fill="url(#r)" opacity=".4"/>
<g fill="#050a07"><rect x="40" y="200" width="60" height="800"/><rect x="200" y="260" width="48" height="740"/><rect x="900" y="220" width="64" height="780"/><rect x="1000" y="300" width="40" height="700"/><path d="M0 180 L70 40 L140 180Z"/></g>
<g><rect x="430" y="140" width="220" height="860" rx="30" fill="#2a1d12"/><rect x="430" y="140" width="220" height="860" rx="30" fill="none" stroke="#4a3320" stroke-width="6"/>
<path d="M430 340 Q340 300 290 240 M650 400 Q760 350 800 290" stroke="#2a1d12" stroke-width="32" fill="none"/></g>
<text x="540" y="420" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="52" fill="#d9c08a" letter-spacing="2" transform="rotate(-90 540 420)" opacity=".9">CROATOAN</text>
<ellipse cx="540" cy="900" rx="500" ry="70" fill="#9cc29a" opacity=".1"/>`),
mh:SVG(grad('g','#02060f','#0a2744'),`<rect width="1080" height="1000" fill="url(#g)"/>${STARS(160,47,500)}
<g fill="#0a2d4f" opacity=".9"><path d="M0 700 Q270 650 540 700 T1080 700 V1000 H0Z"/></g><g fill="#061c33"><path d="M0 790 Q270 740 540 790 T1080 790 V1000 H0Z"/></g>
<path d="M120 380 Q400 260 640 420 T940 560" stroke="#f7c52b" stroke-width="5" stroke-dasharray="4 18" fill="none" stroke-linecap="round"/>
<g transform="translate(560 330) rotate(8)" fill="#e6ebf5"><path d="M0 30 H220 L255 48 L220 66 H0Z"/><path d="M80 30 L140 -25 H158 L125 30Z"/><path d="M80 66 L140 118 H158 L125 66Z"/><path d="M0 30 L-8 -6 H8 L36 30Z"/></g>
<text x="870" y="640" font-family="Anton" font-size="260" fill="#f7c52b" opacity=".9">?</text>`),
zod:SVG(grad('g','#14090a','#050203')+glow('r','#a11e22'),`<rect width="1080" height="1000" fill="url(#g)"/><circle cx="540" cy="440" r="330" fill="url(#r)" opacity=".5"/>
<g fill="none" stroke="#e8e0cf" stroke-width="9" opacity=".95"><circle cx="540" cy="440" r="210"/><path d="M540 190 V690 M290 440 H790"/></g>
<g font-family="Oswald" font-weight="700" font-size="58" fill="#cfc6b0" opacity=".85"><text x="90" y="170">Z ⊕ ⊙ ▽ ◁ ∆</text><text x="620" y="190">♁ ⊗ ◇ ∩ ☽</text><text x="80" y="800">△ ⊙ Ω ⊿ ∮ ⊕</text><text x="600" y="820">⌖ ∇ ⊗ ☉ ▷</text></g>`)
};

const logo='logo.png';
const cards=[
{k:'wow',t:'WOW! Sinyali',d:'1977’de bir radyo teleskobu uzaydan <b>72 saniye süren</b> güçlü bir sinyal yakaladı. Bilim insanı kenara <b>“Wow!”</b> yazdı. Sinyal bir daha hiç duyulmadı.'},
{k:'voy',t:'Voynich El Yazması',d:'Yaklaşık 600 yıllık bu kitap <b>hiçbir dilde okunamayan</b> bir alfabeyle yazıldı. Sayfaları bilinmeyen bitkilerle dolu. Çözmeyen kalmadı.'},
{k:'dbc',t:'D.B. Cooper',d:'1971’de bir yolcu uçağını kaçırdı, <b>200 bin dolar</b> fidye aldı ve havada paraşütle atladı. Kimliği <b>hâlâ kanıtlanamadı</b>.'},
{k:'mary',t:'Mary Celeste',d:'1872’de Atlantik’te sürüklenen geminin yükü yerindeydi, gemi sağlamdı. Ama içindeki <b>10 kişi</b> ortada yoktu.'},
{k:'kry',t:'Kryptos',d:'CIA binasındaki bu heykelde <b>dört şifreli bölüm</b> var. Üçü çözüldü. 97 harflik <b>son bölüm</b> 30 yıldan uzun süredir çözülemiyor.'},
{k:'dya',t:'Dyatlov Geçidi',d:'1959’da Ural Dağları’nda <b>9 dağcı</b> çadırlarını içeriden kesip kaçtı ve hayatta kalamadı. Nedeni bugün bile <b>tartışılıyor</b>.'},
{k:'ame',t:'Amelia Earhart',d:'1937’de dünya turu sırasında <b>Pasifik üzerinde</b> kayboldu. Uçağından ve kendisinden tek bir <b>kesin iz</b> bulunamadı.'},
{k:'roa',t:'Roanoke Kayıp Koloni',d:'1590’da dönen bir kaptan <b>yaklaşık 115 kişilik</b> koloniyi bomboş buldu. Tek ipucu: ağaca kazınmış <b>“CROATOAN”</b> yazısı.'},
{k:'mh',t:'MH370',d:'2014’te <b>239 kişiyle</b> havalanan uçak radardan kayboldu. Yıllarca süren aramaya rağmen <b>ana enkaz bulunamadı</b>.'},
{k:'zod',t:'Zodyak Katili',d:'1960’ların sonunda gazetelere <b>şifreli mektuplar</b> gönderen seri katil yakalanamadı. Bir şifre 2020’de çözüldü; <b>kimliği hâlâ meçhul</b>.'}
];
let h='';
h+=`<div class="slide" id="s0">${scenes.cover}<div class="fade"></div><div class="brand"><img src="${logo}">DÜNYADAN BİŞEYLER</div>
<div class="band"><h2 style="font-size:82px;line-height:1.1">Dünyada insanların hâlâ cevabını bulamadığı <span class="y">10 olay</span></h2><p style="font-size:34px;margin-top:22px;color:#ccc">KAYDIR →</p></div></div>`;
cards.forEach((c,i)=>{h+=`<div class="slide" id="s${i+1}">${scenes[c.k]}<div class="fade"></div><div class="num">${String(i+1).padStart(2,'0')}</div><div class="brand"><img src="${logo}">DÜNYADAN BİŞEYLER</div>
<div class="band"><h2>${c.t}</h2><p>${c.d}</p></div></div>`});
h+=`<div class="slide" id="s11" style="background:radial-gradient(circle at 50% 38%,#0f2a66,#02040d 70%)">
<img src="${logo}" style="position:absolute;left:190px;top:90px;width:700px;height:700px;border-radius:50%;box-shadow:0 0 90px #3a6bff88">
<div class="band" style="height:520px;padding-top:40px"><h2 style="font-size:100px;line-height:1.1">Sayfamız tekrar karşına çıkmayabilir, <span class="y">beğendiysen takip et</span></h2></div></div>`;
document.getElementById('root').innerHTML=h;
</script></body></html>
